[package]
name = "boladao"
version = "1.1.1"
description = "Boladão — Downloader desktop com yt-dlp, Deno e FFmpeg embutidos"
authors = ["hyak"]
edition = "2021"
default-run = "boladao"

[lib]
name = "boladao_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
tar = "0.4"
zstd = { version = "0.13", features = ["zstdmt"] }
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies]
tauri = { version = "2.12.6", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-notification = "2.8.1"
drag = "2.1.1"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tar = "0.4"
zstd = "0.13"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
rand = "0.8"
socket2 = { version = "0.5", features = ["all"] }
url = "2"
regex = "1"
parking_lot = "0.12"
futures-util = "0.3"
minisign-verify = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_System_JobObjects",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_Storage_FileSystem",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
] }

[dev-dependencies]
insta = { version = "1.42", features = ["yaml", "json"] }
tempfile = "3"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
opt-level = 3
panic = "abort"
