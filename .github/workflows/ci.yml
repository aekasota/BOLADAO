name: CI

# Checks every push to main and every pull request on the three systems Boladão runs on: frontend
# types and build, then the Rust tests.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check and build the frontend
        run: npm run build

      - name: Frontend tests
        run: npm test

      # yt-dlp, Deno, FFmpeg and the WebView2 bootstrapper are embedded at build time.
      - name: Cache engines
        uses: actions/cache@v4
        with:
          path: |
            vendor/cache
            vendor/bin
          key: engines-${{ hashFiles('vendor/manifest.json', 'scripts/fetch-binaries.ps1') }}

      - name: Fetch engines (pinned versions, checksums and signatures verified)
        shell: powershell
        run: ./scripts/fetch-binaries.ps1

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  linux:
    # 22.04: the oldest Ubuntu still supported, so the packages run on older systems too.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: System libraries (WebKitGTK, tray, Secret Service)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libdbus-1-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check and build the frontend
        run: npm run build

      - name: Cache engines
        uses: actions/cache@v4
        with:
          path: |
            vendor/cache
            vendor/bin/x86_64-unknown-linux-gnu
          key: engines-linux-${{ hashFiles('vendor/x86_64-unknown-linux-gnu.json', 'scripts/fetch-binaries.py') }}

      - name: Fetch engines (pinned versions, checksums verified)
        run: python3 scripts/fetch-binaries.py x86_64-unknown-linux-gnu

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  macos:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check and build the frontend
        run: npm run build

      # The tests never run the engines, and building FFmpeg from source takes long: the real
      # engines are built in the release workflow.
      - name: Placeholder engines
        run: |
          for c in ytdlp deno ffmpeg; do
            mkdir -p "vendor/bin/aarch64-apple-darwin/$c"
            echo placeholder > "vendor/bin/aarch64-apple-darwin/$c/.placeholder"
          done

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
