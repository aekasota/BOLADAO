name: CI

# Checks every push to main and every pull request on the three systems Boladão runs on: frontend
# types and build, then the Rust tests.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check and build the frontend
        run: npm run build

      - name: Frontend tests
        run: npm test

      # yt-dlp, Deno, FFmpeg and the WebView2 bootstrapper are embedded at build time.
      - name: Cache engines
        uses: actions/cache@v6
        with:
          path: |
            vendor/cache
            vendor/bin
          key: engines-${{ hashFiles('vendor/manifest.json', 'scripts/fetch-binaries.ps1') }}

      - name: Fetch engines (pinned versions, checksums and signatures verified)
        shell: powershell
        run: ./scripts/fetch-binaries.ps1

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  linux:
    # 22.04: the oldest Ubuntu still supported, so the packages run on older systems too.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: System libraries (WebKitGTK, tray, Secret Service)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libdbus-1-dev

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check and build the frontend
        run: npm run build

      - name: Cache engines
        uses: actions/cache@v6
        with:
          path: |
            vendor/cache
            vendor/bin/x86_64-unknown-linux-gnu
          key: engines-linux-${{ hashFiles('vendor/x86_64-unknown-linux-gnu.json', 'scripts/fetch-binaries.py') }}

      - name: Fetch engines (pinned versions, checksums verified)
        run: python3 scripts/fetch-binaries.py x86_64-unknown-linux-gnu

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  macos:
    # GitHub retires each macOS image on a schedule (macos-14 went in November 2026). The runner's
    # version doesn't limit where the app runs, so the job follows the newest image.
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check and build the frontend
        run: npm run build

      # Real engines, as on the other systems: the tests check what gets embedded, and this is where
      # the FFmpeg recipe of the release first runs. Compiling FFmpeg takes a while, so the cache
      # keeps it, and the release workflow restores the same cache for Apple Silicon.
      - name: Cache engines
        uses: actions/cache@v6
        with:
          path: |
            vendor/cache
            vendor/bin/aarch64-apple-darwin
          key: engines-macos-aarch64-${{ hashFiles('vendor/aarch64-apple-darwin.json', 'vendor/ffmpeg-sources.json', 'scripts/fetch-binaries.py', 'scripts/build-ffmpeg-macos.sh') }}

      - name: Fetch engines (pinned versions, checksums verified, FFmpeg built from source)
        run: python3 scripts/fetch-binaries.py aarch64-apple-darwin

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
